<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 개똥같은할리데이 - 김회장 실종사건 & 유산쟁탈전</title>
    <style>
        :root {
            --bg-color: #0d0a0a;
            --card-bg: #171212;
            --accent-blood: #d62828;
            --accent-gold: #f77f00;
            --text-color: #e0e0e0;
            --text-sub: #9e9e9e;
            --border-color: #3d2323;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px 15px;
            max-width: 500px;
            margin: 0 auto;
            background-image: radial-gradient(#261111 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* 헤더 & 엠블럼 */
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px dashed var(--accent-blood);
            margin-bottom: 20px;
            position: relative;
        }

        .emblem-wrapper {
            width: 200px;
            max-width: 80%;
            margin: 0 auto 15px auto;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--accent-blood);
            box-shadow: 0 0 20px rgba(214, 40, 40, 0.5);
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: sepia(30%) contrast(120%);
        }

        .emblem-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        .title-main {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--accent-blood);
            text-transform: uppercase;
            letter-spacing: -0.5px;
            text-shadow: 2px 2px 4px #000000;
        }

        .title-sub {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-gold);
            margin-top: 5px;
        }

        .event-date {
            display: inline-block;
            background-color: var(--accent-blood);
            color: #fff;
            font-weight: bold;
            padding: 4px 14px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        /* 사건 개요 기밀 카드 */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .card::before {
            content: "CONFIDENTIAL";
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 0.65rem;
            color: var(--border-color);
            letter-spacing: 2px;
            font-weight: bold;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-blood);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            border-left: 4px solid var(--accent-blood);
            padding-left: 8px;
        }

        /* 정보 그리드 */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .info-box {
            background-color: #0f0a0a;
            padding: 10px;
            border: 1px solid #2a1515;
            border-radius: 4px;
            text-align: center;
        }

        .info-label {
            font-size: 0.78rem;
            color: var(--text-sub);
        }

        .info-value {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-color);
            margin-top: 2px;
        }

        /* 리스트 및 타임라인 */
        ol, ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .timeline {
            list-style: none;
            padding-left: 0;
        }

        .timeline-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background-color: #0f0a0a;
            border: 1px solid #2a1515;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 0.88rem;
        }

        .timeline-time {
            font-weight: bold;
            color: var(--accent-gold);
        }

        /* 강조 스타일 */
        .highlight {
            color: var(--accent-blood);
            font-weight: bold;
        }

        .highlight-gold {
            color: var(--accent-gold);
            font-weight: bold;
        }

        .notice-box {
            background-color: rgba(214, 40, 40, 0.08);
            border: 1px dashed var(--accent-blood);
            padding: 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #ccc;
            margin-top: 10px;
        }

        /* 미션 섹션 및 버튼 추가 */
        .mission-card {
            border: 2px solid var(--accent-blood);
            background-color: #1f0b0b;
            text-align: center;
        }

        .mission-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            background-color: var(--accent-blood);
            color: #fff;
            font-size: 1.05rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(214, 40, 40, 0.4);
            transition: all 0.2s ease;
        }

        .mission-btn:hover {
            background-color: #ff3333;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.8);
        }

        /* 푸터 */
        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-sub);
            padding: 15px 0;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
