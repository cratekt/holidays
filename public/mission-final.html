<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOP SECRET: FINAL MISSION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #08080a;
      --card-bg: #121316;
      --accent-gold: #c9a050;
      --blood-dark: #4a0000;
      --blood-red: #8b0000;
      --blood-bright: #d11a2a;
      --text-color: #d1d5db;
      --border-color: #262930;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Noto Serif KR', serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      background-image:
        radial-gradient(#1a1c23 1px, transparent 1px),
        radial-gradient(ellipse at 30% 20%, rgba(80,0,0,0.10), transparent 55%),
        radial-gradient(ellipse at 75% 80%, rgba(60,0,0,0.12), transparent 55%);
      background-size: 24px 24px, cover, cover;
      overflow-x: hidden;
      position: relative;
    }

    /* 🎞️ 필름 그레인 노이즈 오버레이 - 더 리얼한 감시카메라/CCTV 질감 */
    .grain-overlay {
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      opacity: 0.06;
      pointer-events: none;
      z-index: 50;
      animation: grainMove 0.4s steps(3) infinite;
      mix-blend-mode: overlay;
    }

    @keyframes grainMove {
      0%   { transform: translate(0,0); }
      33%  { transform: translate(-3%, 2%); }
      66%  { transform: translate(2%, -2%); }
      100% { transform: translate(0,0); }
    }

    /* 🕯️ 비네트 - 어두운 조명 아래 있는 듯한 연출 */
    .vignette-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 5;
      background: radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,0.35) 75%, rgba(0,0,0,0.85) 100%);
    }

    /* 💡 불안정한 형광등 플리커 효과 */
    .flicker-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 6;
      animation: flicker 7s infinite;
    }

    @keyframes flicker {
      0%, 19%, 21%, 23%, 24%, 55%, 57%, 100% { background: rgba(0,0,0,0); }
      20%  { background: rgba(0,0,0,0.3); }
      22%  { background: rgba(139,0,0,0.06); }
      23.5%{ background: rgba(0,0,0,0.15); }
      56%  { background: rgba(0,0,0,0.18); }
    }

    /* 🩸 핏자국(Blood Drips) 애니메이션 */
    .blood-drips-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }

    .drip {
      position: absolute;
      top: -10px;
      background: linear-gradient(to bottom, var(--blood-dark), var(--blood-red) 70%, var(--blood-bright));
      border-radius: 0 0 4px 4px;
      box-shadow: inset 1px 0 2px rgba(0,0,0,0.8), 0 0 4px var(--blood-red);
      animation: realisticDrip 5s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }

    .drip::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 10px;
      background: var(--blood-bright);
      border-radius: 50% 50% 60% 60%;
      box-shadow: 0 0 8px var(--blood-bright), inset -1px -1px 2px rgba(0,0,0,0.6);
    }

    @keyframes realisticDrip {
      0% { height: 0px; opacity: 0; }
      15% { opacity: 0.95; }
      70% { height: 160px; opacity: 0.9; }
      85% { height: 190px; opacity: 0.3; }
      100% { height: 200px; opacity: 0; }
    }

    .dossier-card {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 4px;
      padding: 36px 28px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 20px rgba(139, 0, 0, 0.25);
      position: relative;
    }

    /* ⚠️ 통제선 테이프 연출 */
    .warning-tape {
      position: absolute;
      top: 26px;
      left: -42px;
      width: 175px;
      padding: 5px 0;
      background: repeating-linear-gradient(45deg, #d4b106, #d4b106 12px, #17181b 12px, #17181b 24px);
      color: #17181b;
      font-family: 'Special Elite', cursive;
      font-size: 0.6rem;
      font-weight: bold;
      text-align: center;
      letter-spacing: 1px;
      transform: rotate(-40deg);
      box-shadow: 0 3px 8px rgba(0,0,0,0.7);
      z-index: 20;
      opacity: 0.92;
      user-select: none;
    }

    .stamp {
      position: absolute;
      top: 15px;
      right: -10px;
      color: var(--blood-bright);
      border: 3px double var(--blood-bright);
      font-family: 'Special Elite', cursive;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 4px 12px;
      text-transform: uppercase;
      transform: rotate(12deg);
      opacity: 0.85;
      letter-spacing: 2px;
      text-shadow: 0 0 5px rgba(209, 26, 42, 0.5);
    }

    .team-badge {
      display: inline-block;
      background: rgba(201, 160, 80, 0.15);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      padding: 4px 10px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 3px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 20px 0;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--border-color);
    }

    .mission-story {
      line-height: 1.75;
      font-size: 0.92rem;
      color: #c0c4cc;
      background: rgba(0, 0, 0, 0.4);
      padding: 16px;
      border-left: 3px solid var(--blood-red);
      margin-bottom: 20px;
      word-break: keep-all;
    }

    .login-box, .auth-box {
      background: #090a0c;
      border: 1px solid #1f2228;
      padding: 24px 20px;
      border-radius: 6px;
      text-align: center;
    }

    .custom-select, .custom-input {
      background: #121316;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 0.95rem;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    .custom-btn {
      background: var(--blood-red);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .custom-btn:hover {
      background: var(--blood-bright);
      box-shadow: 0 0 10px rgba(209, 26, 42, 0.5);
    }

    .progress-bar-container {
      background: #000;
      border: 1px solid var(--border-color);
      height: 14px;
      border-radius: 7px;
      overflow: hidden;
      margin: 15px 0;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--blood-red), var(--accent-gold));
      transition: width 0.5s ease;
    }

    /* ⏱️ 카운트다운 타이머 전용 스타일 */
    .timer-container {
      background: rgba(209, 26, 42, 0.1);
      border: 1px solid var(--blood-bright);
      border-radius: 4px;
      padding: 8px 12px;
      margin: 12px 0;
      font-family: 'Special Elite', cursive;
      color: var(--blood-bright);
      font-size: 0.88rem;
    }

    .timer-digits {
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 1.5px;
    }

    .location-display {
      margin-top: 18px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 1.05rem;
      color: var(--accent-gold);
      font-weight: bold;
      min-height: 28px;
      word-break: keep-all;
      line-height: 1.5;
    }

    .unlocked-effect {
      animation: pulseGold 1.5s infinite alternate;
      color: var(--accent-gold);
      text-shadow: 0 0 12px rgba(201, 160, 80, 0.6);
    }

    @keyframes pulseGold {
      0% { text-shadow: 0 0 5px rgba(201, 160, 80, 0.4); }
      100% { text-shadow: 0 0 18px rgba(201, 160, 80, 0.9); }
    }

    .reset-notice {
      font-size: 0.72rem;
      color: #717680;
      margin-top: 10px;
    }

    .logout-btn {
      background: transparent;
      border: none;
      color: #666;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- 🎬 리얼리티 연출용 배경 오버레이 (그레인 / 비네트 / 조명 플리커) -->
  <div class="grain-overlay"></div>
  <div class="vignette-overlay"></div>
  <div class="flicker-overlay"></div>

  <div class="dossier-card">
    <!-- 🩸 핏자국 연출 -->
    <div class="blood-drips-container">
      <div class="drip" style="left: 8%;  width: 3px; animation-delay: 0s;    animation-duration: 4.5s;"></div>
      <div class="drip" style="left: 27%; width: 2px; animation-delay: 2.4s;  animation-duration: 6.2s;"></div>
      <div class="drip" style="left: 45%; width: 5px; animation-delay: 1.8s;  animation-duration: 5.5s;"></div>
      <div class="drip" style="left: 63%; width: 3px; animation-delay: 3.2s;  animation-duration: 4.8s;"></div>
      <div class="drip" style="left: 82%; width: 3px; animation-delay: 0.8s;  animation-duration: 4.2s;"></div>
      <div class="drip" style="left: 95%; width: 2px; animation-delay: 1.2s;  animation-duration: 5.8s;"></div>
    </div>

    <div class="warning-tape">CRIME SCENE</div>
    <div class="stamp">FINAL MISSION</div>

    <!-- 1. 로그인 화면 -->
    <div id="login-section">
      <h2 class="card-title">팀 세션 인증</h2>
      <div class="mission-story">
        부여받은 팀을 선택하고, <strong>팀 전용 비밀번호</strong>를 입력하여 보안 서버에 접속하십시오.
      </div>
      <div class="login-box">
        <select id="team-select" class="custom-select">
          <option value="A">TEAM A</option>
          <option value="B">TEAM B</option>
          <option value="C">TEAM C</option>
        </select>
        <input type="password" id="team-pass" class="custom-input" placeholder="팀 비밀번호 입력">
        <button onclick="loginTeam()" class="custom-btn">세션 접속</button>
      </div>
    </div>

    <!-- 2. 미션 메인 화면 -->
    <div id="mission-section" style="display: none;">
      <div id="team-display" class="team-badge">TEAM LOADING...</div>
      <h2 class="card-title">최종 목적지 해독</h2>

      <div class="mission-story">
        가족 또는 친구에게 <strong>"나도 사랑해"</strong> 답장 문자를 받아 진행자에게 인증하라.<br><br>
        팀원 3명의 인증이 완료되면 최종 목적지가 즉시 공개된다.
      </div>

      <div class="auth-box">
        <div style="font-size: 0.85rem; color: #8a909a; margin-bottom: 8px;">
          팀 인증 진행도 (<span id="count-text">0</span>/3)
        </div>
        <div class="progress-bar-container">
          <div id="progress-bar" class="progress-bar"></div>
        </div>

        <!-- ⏱️ 카운트다운 타이머 -->
        <div class="timer-container">
          🚨 타임아웃 해독 카운트다운: <span id="timer-display" class="timer-digits">30:00</span>
        </div>

        <div style="margin-top: 18px; display: flex; gap: 8px;">
          <input type="password" id="admin-code" class="custom-input" style="margin-bottom: 0;" placeholder="진행자 승인 암호">
          <button onclick="submitAdminAuth()" class="custom-btn" style="width: auto; white-space: nowrap;">승인</button>
        </div>

        <div id="location-result" class="location-display">
          ████████████████████
        </div>

        <div class="reset-notice">※ 본 시스템은 매일 자정(00:00)에 데이터가 자동 초기화됩니다.</div>
        <button onclick="logoutTeam()" class="logout-btn">다른 팀으로 변경 (로그아웃)</button>
      </div>
    </div>
  </div>

  <script>
    // SHA-256 해시 함수
    async function hashText(text) {
      const msgUint8 = new TextEncoder().encode(text);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // SHA-256 해시화된 팀 비밀번호 (1004, 2008, 3012)
    const HASHED_TEAM_PASS = {
      'A': '75992a5ac67ff644d3063976c2effd10bdd93fcc109798e3d5c1acf2e530d01a', // 1004
      'B': 'e5e53c784d5d49de1cabb6e904bf3380026aadcb9769775a268dd304dd9aa2df', // 2008
      'C': 'b33ed571eded536f0f0bc2be4e4384055acd592fe6652a555320fdca4dbeb175'  // 3012
    };

    // SHA-256 해시화된 진행자 암호 (0701)
    const HASHED_ADMIN_CODE = 'dff7d1ad24e683a77f6713e1bb10770ff223ed4f5b17edc0df3ddd7207c8475d'; // 0701

    // 단계별 목적지 주소
    const ADDRESS_STAGES = [
      "████████████████████",                     
      "세종특별자치시 ████████",             
      "세종특별자치시 한누리대로 283 ████",          
      "한누리대로 283 1층 115호 - 청양" 
    ];

    // 자동 공개 제한 시간 (초 단위: 30분 = 1800초)
    const TIMEOUT_SECONDS = 1800; 

    let currentTeam = null;
    let timerInterval = null;

    function getTodayString() {
      const today = new Date();
      return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    }

    async function init() {
      const savedTeam = localStorage.getItem('active_team');
      if (savedTeam && HASHED_TEAM_PASS[savedTeam]) {
        currentTeam = savedTeam;
        showMissionPage();
      } else {
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('mission-section').style.display = 'none';
      }
    }

    async function loginTeam() {
      const team = document.getElementById('team-select').value;
      const pass = document.getElementById('team-pass').value;
      const hashedInput = await hashText(pass);

      if (HASHED_TEAM_PASS[team] === hashedInput) {
        currentTeam = team;
        localStorage.setItem('active_team', team);
        
        // 접속 시점의 세션 시작 시간 기록
        if (!localStorage.getItem(getStartTimeKey())) {
          localStorage.setItem(getStartTimeKey(), Date.now());
        }

        document.getElementById('team-pass').value = '';
        showMissionPage();
      } else {
        alert('팀 비밀번호가 올바르지 않습니다.');
      }
    }

    function logoutTeam() {
      localStorage.removeItem('active_team');
      currentTeam = null;
      if (timerInterval) clearInterval(timerInterval);
      init();
    }

    function showMissionPage() {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('mission-section').style.display = 'block';
      document.getElementById('team-display').innerText = `SESSION: TEAM ${currentTeam}`;

      startTimer();
      updateUI();
    }

    function getTodayStorageKey() {
      return `unlock_count_team_${currentTeam}_${getTodayString()}`;
    }

    function getStartTimeKey() {
      return `start_time_team_${currentTeam}_${getTodayString()}`;
    }

    function getUnlockCount() {
      return parseInt(localStorage.getItem(getTodayStorageKey()) || "0");
    }

    // ⏱️ 실시간 카운트다운 및 타이머 자동 해금 로직
    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);

      let startTime = parseInt(localStorage.getItem(getStartTimeKey()) || Date.now());

      timerInterval = setInterval(() => {
        const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
        const remainingSeconds = TIMEOUT_SECONDS - elapsedSeconds;

        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timer-display').innerText = "00:00 (시간 초과)";
          
          // 제한 시간 경과 시 자동으로 3단계(최종 해금) 처리
          if (getUnlockCount() < 3) {
            localStorage.setItem(getTodayStorageKey(), 3);
            updateUI();
            alert("⏰ [보안 경고] 정해진 시간이 초과되어 서버 보안이 해제되었습니다! 최종 목적지가 자동으로 공개됩니다.");
          }
        } else {
          const minutes = String(Math.floor(remainingSeconds / 60)).padStart(2, '0');
          const seconds = String(remainingSeconds % 60).padStart(2, '0');
          document.getElementById('timer-display').innerText = `${minutes}:${seconds}`;
        }
      }, 1000);
    }

    function updateUI() {
      const count = getUnlockCount();
      document.getElementById('count-text').innerText = count;
      document.getElementById('progress-bar').style.width = `${(count / 3) * 100}%`;
      
      const locationElem = document.getElementById('location-result');
      locationElem.innerText = ADDRESS_STAGES[count];

      if (count === 3) {
        locationElem.classList.add('unlocked-effect');
      } else {
        locationElem.classList.remove('unlocked-effect');
      }
    }

    async function submitAdminAuth() {
      const inputCode = document.getElementById('admin-code').value;
      const hashedInput = await hashText(inputCode);
      let currentCount = getUnlockCount();

      if (currentCount >= 3) {
        alert("이미 모든 인증이 완료되어 최종 목적지가 공개되었습니다.");
        return;
      }

      if (hashedInput === HASHED_ADMIN_CODE) {
        currentCount++;
        localStorage.setItem(getTodayStorageKey(), currentCount);
        document.getElementById('admin-code').value = "";
        updateUI();
        alert(`🏆 승인 완료! (${currentCount}/3) 목적지 단서가 추가 해독되었습니다.`);
      } else {
        alert("진행자 승인 암호가 올바르지 않습니다.");
      }
    }

    init();
  </script>

</body>
</html>
